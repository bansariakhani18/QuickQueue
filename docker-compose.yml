services:
  postgres:
    image: postgres:16-alpine
    container_name: quickqueue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quickqueue}
      POSTGRES_USER: ${POSTGRES_USER:-quickqueue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quickqueue_dev_only}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
